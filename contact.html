<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Blackberry Martin</title>
<meta name="description" content="Booking and press enquiries for Blackberry Martin.">
<meta property="og:title" content="Contact — Blackberry Martin">
<meta property="og:description" content="Booking and press enquiries for Blackberry Martin.">
<meta property="og:image" content="assets/img/og.svg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#241c15">
<link rel="icon" href="assets/img/cover-1.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>
<a class="skip" href="#main">Skip to content</a>

<header class="nav">
  <a class="nav__mark" href="index.html">Blackberry&nbsp;Martin</a>
  <nav class="nav__links" aria-label="Primary">
    <a href="music.html">Music</a>
    <a href="signup.html">Sign Up</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
</header>

<main id="main">

  <section class="wrap page-head">
    <h1 class="h-lg">Contact</h1>
    <p class="lede muted narrow" style="margin-top:1.25rem">
      Booking, press, or anything else? Reach out below.
    </p>
  </section>

  <section class="section wrap">
    <div class="narrow reveal" data-ghl="contact">
      <form class="form" data-success="Got it — we’ll come back to you shortly.">
        <label class="hp" aria-hidden="true">
          Company website <input type="text" name="company_website" tabindex="-1" autocomplete="off">
        </label>
        <div class="form__row">
          <div class="field">
            <label for="c-name">Name <span aria-hidden="true">*</span></label>
            <input id="c-name" type="text" name="name" required autocomplete="name">
          </div>
          <div class="field">
            <label for="c-email">Email <span aria-hidden="true">*</span></label>
            <input id="c-email" type="email" name="email" required autocomplete="email">
          </div>
        </div>
        <div class="field">
          <label for="c-type">Enquiry</label>
          <select id="c-type" name="enquiry_type">
            <option>Booking</option>
            <option>Press / interview</option>
            <option>Sync / licensing</option>
            <option>Something else</option>
          </select>
        </div>
        <div class="field">
          <label for="c-msg">Message <span aria-hidden="true">*</span></label>
          <textarea id="c-msg" name="message" required></textarea>
        </div>
        <div>
          <button class="btn" type="submit">Send</button>
        </div>
        <p class="form__status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

</main>

<footer class="footer">
  <div class="wrap footer__base">
    <ul class="icon-row" data-icons style="justify-content:flex-start"></ul>
    <a class="btn btn--email btn--display" data-link="email" href="#">Email us</a>
    <p>&copy; <span data-year>2026</span> Blackberry Martin</p>
  </div>
</footer>

<!-- Mailing list popup. Fires once on a first visit; the Sign Up link opens it
     any time. The footer bar covers everyone who dismisses it. -->
<div class="modal" id="signup-modal" role="dialog" aria-modal="true" aria-labelledby="signup-modal-title" hidden>
  <div class="modal__panel">
    <button class="modal__close" type="button" aria-label="Close">&times;</button>
    <h2 class="modal__title" id="signup-modal-title">Join the list</h2>
    <p class="modal__sub">First to hear when the new music lands. Once a month at most, unsubscribe whenever.</p>

    <div data-ghl="newsletter">
      <form class="form" data-success="You’re on the list. Talk soon.">
        <label class="hp" aria-hidden="true">
          Company website <input type="text" name="company_website" tabindex="-1" autocomplete="off">
        </label>
        <div class="field">
          <label for="m-name">First name</label>
          <input id="m-name" type="text" name="first_name" autocomplete="given-name">
        </div>
        <div class="field">
          <label for="m-email">Email <span aria-hidden="true">*</span></label>
          <input id="m-email" type="email" name="email" required autocomplete="email">
        </div>
        <div>
          <button class="btn" type="submit">Join the list</button>
        </div>
        <p class="form__status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
